<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stok Uyarı Paneli</title>
<style>
  :root {
    --navy: #0B2A5B;
    --navy-2: #163d7a;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1b2433;
    --muted: #5d6b82;
    --line: #e2e7ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header.top {
    background: var(--card);
    border-bottom: 4px solid var(--navy);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  /* Logo görselinde çok boşluk var: kutuyu sabitleyip object-fit: cover ile kırpıyoruz */
  .logo {
    width: 190px;
    height: 30px;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .title-block h1 {
    margin: 0;
    font-size: 20px;
    color: var(--navy);
    letter-spacing: .2px;
  }
  .title-block .today { color: var(--muted); font-size: 13px; }
  .source-badge {
    margin-left: auto;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
  }
  .source-badge.sample {
    background: #fff4d6;
    color: #8a5a00;
    border: 2px dashed #e0a800;
    letter-spacing: 1px;
  }
  .source-badge.file {
    background: #e7eefb;
    color: var(--navy);
    border: 2px solid #b9cbee;
    font-weight: 600;
  }
  main { max-width: 1360px; margin: 0 auto; padding: 20px 24px 40px; }

  /* ---------- Özet kutusu (IK-5) ---------- */
  .summary {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    background: var(--card);
    border-radius: 10px;
    padding: 18px 22px;
    border-left: 8px solid #c62828;
    box-shadow: 0 1px 3px rgba(11, 42, 91, .08);
    margin-bottom: 16px;
  }
  .summary.ok { border-left-color: #2e7d32; }
  .summary-main { flex: 1 1 320px; }
  .summary-headline { font-size: 24px; font-weight: 700; color: #b71c1c; line-height: 1.25; }
  .summary.ok .summary-headline { color: #2e7d32; }
  .summary-sub { color: var(--muted); margin-top: 4px; }
  .counters { display: flex; gap: 8px; flex-wrap: wrap; }
  .counter {
    min-width: 86px;
    padding: 8px 12px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid var(--line);
    background: #fafbfd;
  }
  .counter .n { font-size: 22px; font-weight: 700; display: block; }
  .counter .l { font-size: 12px; color: var(--muted); }
  .counter.TUKENDI .n { color: #212121; }
  .counter.KRITIK .n { color: #c62828; }
  .counter.DIKKAT .n { color: #b07800; }
  .counter.YETERLI .n { color: #2e7d32; }
  .counter.KONTROL .n { color: #1e5fb4; }
  .counter.HAREKETSIZ .n { color: #8a94a6; }

  /* ---------- Tablo ---------- */
  .table-wrap {
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(11, 42, 91, .08);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 10px; text-align: left; white-space: nowrap; }
  th {
    background: var(--navy);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    position: sticky;
    top: 0;
  }
  td { border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.name { white-space: normal; min-width: 220px; }
  /* IK-12: ürün görseli / kategori ikonu */
  .prod { display: flex; align-items: center; gap: 10px; }
  .thumb {
    width: 40px; height: 40px; flex: none;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    object-fit: cover;
  }
  .thumb.icon {
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 22px; background: #f0f3f8;
  }
  td.sku { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  td.strong { font-weight: 700; }

  tr.row-TUKENDI    { background: #ebebeb; }
  tr.row-TUKENDI td:first-child { box-shadow: inset 5px 0 0 #212121; }
  tr.row-KRITIK     { background: #fdeaea; }
  tr.row-KRITIK td:first-child { box-shadow: inset 5px 0 0 #c62828; }
  tr.row-DIKKAT     { background: #fff6dc; }
  tr.row-DIKKAT td:first-child { box-shadow: inset 5px 0 0 #e0a800; }
  tr.row-YETERLI td:first-child { box-shadow: inset 5px 0 0 #43a047; }
  tr.row-KONTROL    { background: #eaf2fd; }
  tr.row-KONTROL td:first-child { box-shadow: inset 5px 0 0 #1e6fd9; }
  tr.row-HAREKETSIZ { color: #8a94a6; }

  /* IK-13: "Ne yapmalı?" */
  td.action { white-space: normal; min-width: 210px; line-height: 1.3; }
  td.action.urgent { color: #b71c1c; font-weight: 700; }
  td.action.soon { color: #6b4b00; font-weight: 600; }
  td.action.none { color: #9aa5b6; }
  td.action.check { color: #1e5fb4; font-weight: 400; }   /* Kontrol et: mavi, kalın değil */
  td.action.check .action-sub { color: #4a78b8; }
  .action-sub { display: block; font-size: 12px; font-weight: 400; }
  td.action.urgent .action-sub { color: #c62828; }
  td.action.soon .action-sub { color: var(--muted); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge.TUKENDI    { background: #212121; color: #fff; }
  .badge.KRITIK     { background: #c62828; color: #fff; }
  .badge.DIKKAT     { background: #f6c343; color: #4a3500; }
  .badge.YETERLI    { background: #dff1e0; color: #1b5e20; }
  .badge.KONTROL    { background: #1e6fd9; color: #fff; }
  .badge.HAREKETSIZ { background: #eceff3; color: #5d6b82; }

  .empty { padding: 28px; text-align: center; color: var(--muted); }

  .inactive-bar {
    margin-top: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button.link {
    background: none;
    border: 1px solid #b9cbee;
    color: var(--navy);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font: inherit;
  }
  button.link:hover { background: #e7eefb; }

  /* ---------- Yükleme çubuğu (IK-8, IK-9, IK-11) ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .btn:hover { background: var(--navy-2); }
  .btn.secondary { background: #fff; color: var(--navy); border: 1px solid #b9cbee; }
  .btn.secondary:hover { background: #e7eefb; }
  .hint { color: var(--muted); font-size: 12px; }
  body.dragging main { outline: 3px dashed var(--navy); outline-offset: -8px; }

  .msg {
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 14px;
    position: relative;
  }
  .msg.error { background: #fdecea; border: 1px solid #f5b5b0; color: #8e1b14; }
  .msg.warn  { background: #fff6dc; border: 1px solid #f0d58a; color: #5c4300; }
  .msg b { display: block; margin-bottom: 4px; }
  .msg ul { margin: 6px 0 0; padding-left: 20px; max-height: 180px; overflow: auto; }
  /* ---------- Filtreler (IK-10) ---------- */
  .filters {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .chip {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
  }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .filters select, .filters input {
    font: inherit;
    padding: 6px 10px;
    border: 1px solid #c9d3e3;
    border-radius: 6px;
    background: #fff;
  }
  .filters input { min-width: 220px; }
  .filters .count { margin-left: auto; color: var(--muted); font-size: 13px; }
  @media (max-width: 600px) {
    header.top, main { padding-left: 16px; padding-right: 16px; }
    .summary-headline { font-size: 20px; }
    .filters input { min-width: 0; width: 100%; }
  }
  .msg .close {
    position: absolute; top: 8px; right: 10px;
    background: none; border: none; font-size: 18px; cursor: pointer; color: inherit;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

/* ============================================================
   HESAP MOTORU (IK-1 … IK-4, IK-6)
   Her satır = bir SKU (her beden ayrı), gruplama yok.
   ============================================================ */
const STATUS = {
  TUKENDI:    { key: "TUKENDI",    label: "Tükendi",    icon: "⚫", order: 0 },
  KRITIK:     { key: "KRITIK",     label: "Kritik",     icon: "🔴", order: 1 },
  DIKKAT:     { key: "DIKKAT",     label: "Dikkat",     icon: "🟡", order: 2 },
  KONTROL:    { key: "KONTROL",    label: "Kontrol et", icon: "🔵", order: 3 },
  YETERLI:    { key: "YETERLI",    label: "Yeterli",    icon: "🟢", order: 4 },
  HAREKETSIZ: { key: "HAREKETSIZ", label: "Hareketsiz", icon: "⚪", order: 5 },
};
const STATUS_LIST = Object.values(STATUS).sort((a, b) => a.order - b.order);
const DEFAULT_STATUS_ON = ["TUKENDI", "KRITIK", "DIKKAT", "KONTROL", "YETERLI"];   // Hareketsiz varsayılan gizli

/** IK-3: adet alt sınırı – satışı olan üründe reyon stoğu bunun altına düşerse Kritik */
const MIN_STOK = 2;

const TR_MONTHS_SHORT = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];

/** IK-3: durum belirleme (üstten alta öncelik) */
function getStatus(stok, satis, tedarik, kalanGun) {
  if (satis === 0) {
    // mevcut_stok reyon stoğu: stok 0 + satış 0 talep yokluğu sayılmaz, ürün reyonda yok → depoyu kontrol et
    return stok === 0 ? STATUS.KONTROL : STATUS.HAREKETSIZ;
  }
  if (stok === 0) return STATUS.TUKENDI;
  if (kalanGun <= tedarik || stok < MIN_STOK) return STATUS.KRITIK;   // gün kuralı veya adet kuralı
  if (kalanGun <= 2 * tedarik) return STATUS.DIKKAT;
  return STATUS.YETERLI;
}

/** IK-1, IK-2, IK-3: tek satırın hesaplanmış hali */
function computeRow(item, today = new Date()) {
  const stok = item.mevcut_stok;
  const satis = item.gunluk_satis_ortalamasi;
  const tedarik = item.tedarik_suresi_gun;
  // IK-1: 1 ondalığa yuvarlanır; durum da bu değerle belirlenir ki ekranda görülen ile kural tutarlı olsun
  const kalanGun = satis > 0 ? Math.round((stok / satis) * 10) / 10 : Infinity;
  const status = getStatus(stok, satis, tedarik, kalanGun);
  let bitisTarihi = null;                                          // IK-2
  if (Number.isFinite(kalanGun)) {
    bitisTarihi = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    bitisTarihi.setDate(bitisTarihi.getDate() + Math.floor(kalanGun));
  }
  // IK-4: tedarik süresine göre kalan tampon (1 ondalık; kayan nokta artığı olmasın)
  const pay = Number.isFinite(kalanGun) ? Math.round((kalanGun - tedarik) * 10) / 10 : Infinity;
  const row = { ...item, kalanGun, pay, bitisTarihi, status };
  row.action = getAction(row, today);
  return row;
}

/** IK-13: "Ne yapmalı?" – miktar önerisi yok, yalnızca ne zaman sipariş verileceği */
function getAction(r, today) {
  switch (r.status) {
    case STATUS.TUKENDI:
      return { main: "Bugün sipariş ver", sub: `satış kaybediliyor · ~${fmtNum(r.tedarik_suresi_gun)} gün daha stoksuz`, cls: "urgent" };
    case STATUS.KRITIK:
      if (r.pay < 0) return { main: "Bugün sipariş ver", sub: `~${Math.ceil(-r.pay)} gün stoksuz kalacak`, cls: "urgent" };
      if (r.pay === 0) return { main: "Bugün sipariş ver", sub: "son gün, mal stok biterken gelir", cls: "urgent" };
      // pay > 0 → yalnızca adet kuralıyla kritik
      return { main: "Bugün sipariş ver", sub: `reyonda ${fmtNum(r.mevcut_stok)} adet kaldı (alt sınır ${MIN_STOK})`, cls: "urgent" };
    case STATUS.KONTROL:
      return { main: "Reyonda yok, depoyu kontrol et", sub: "satış verisi yok, reyona çıkmamış olabilir", cls: "check" };
    case STATUS.DIKKAT: {
      const n = Math.floor(r.pay);
      if (n === 0) return { main: "En geç bugün sipariş ver", sub: "", cls: "soon" };
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + n);
      return { main: `En geç ${n} gün içinde sipariş ver`, sub: `(≈ ${fmtDate(d)})`, cls: "soon" };
    }
    case STATUS.YETERLI:
      return { main: "Sipariş gerekmez", sub: "", cls: "none" };
    default:
      return { main: "—", sub: "", cls: "none" };
  }
}

/** IK-4: otomatik sıralama – durum önceliği, sonra grup içi kural */
function compareRows(a, b) {
  if (a.status.order !== b.status.order) return a.status.order - b.status.order;
  if (a.status === STATUS.TUKENDI) {
    // kaybedilen satış büyük olan üstte
    return b.gunluk_satis_ortalamasi - a.gunluk_satis_ortalamasi || a.SKU.localeCompare(b.SKU, "tr");
  }
  if (a.status === STATUS.KONTROL) return a.SKU.localeCompare(b.SKU, "tr");
  if (a.status === STATUS.HAREKETSIZ) {
    return b.mevcut_stok - a.mevcut_stok || a.SKU.localeCompare(b.SKU, "tr");
  }
  return (a.pay - b.pay) || (a.kalanGun - b.kalanGun) || a.SKU.localeCompare(b.SKU, "tr");
}

function computeAll(items, today = new Date()) {
  return items.map(it => computeRow(it, today)).sort(compareRows);
}

/* ---------- Biçimlendirme ---------- */
function fmtNum(n) {
  return Number.isInteger(n) ? String(n) : n.toLocaleString("tr-TR", { maximumFractionDigits: 2 });
}
function fmtKalanGun(r) {
  if (!Number.isFinite(r.kalanGun)) return "—";
  return r.kalanGun.toLocaleString("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });  // IK-1: 1 ondalık
}
function fmtBitis(r) {
  if (r.status === STATUS.TUKENDI) return "Bitti";
  if (!r.bitisTarihi) return "—";   // Hareketsiz / Kontrol et: satış yok, bitiş hesaplanamaz
  return "≈ " + fmtDate(r.bitisTarihi);
}
function fmtDate(d) {
  return d.getDate() + " " + TR_MONTHS_SHORT[d.getMonth()];
}

   EKRAN (IK-5, IK-7)
   ============================================================ */
const state = {
  rows: [],              // hesaplanmış + sıralanmış tüm satırlar
  showInactive: false,   // IK-7: hareketsizler varsayılan gizli
  // IK-10: filtreler (sıralamayı değiştirmez, yalnızca süzer)
  statusOn: new Set(DEFAULT_STATUS_ON),
  category: "",
  search: "",
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function countByStatus(rows) {
  const c = {};
  STATUS_LIST.forEach(s => c[s.key] = 0);
  rows.forEach(r => c[r.status.key]++);
  return c;
}

/** IK-5: özet kutusu */
function renderSummary() {
  const c = countByStatus(state.rows);
  const x = c.TUKENDI + c.KRITIK;
  const box = document.getElementById("summary");
  box.classList.toggle("ok", x === 0);

  let headline, sub;
  if (state.rows.length === 0) {
    headline = "Gösterilecek ürün yok";
    sub = "Geçerli satır içeren bir dosya yükleyin.";
  } else if (x === 0) {
    headline = "✔ Bugün acil sipariş yok";
    sub = c.DIKKAT > 0
      ? `${c.DIKKAT} ürün yakında sipariş gerektirecek (Dikkat), tabloda en üstte.`
      : "Tüm ürünlerin stoğu tedarik süresinin en az 2 katı kadar yetiyor.";
  } else {
    headline = `Bugün <u>${x} ürün</u> için sipariş vermelisin`;
    const parts = [];
    if (c.TUKENDI) parts.push(`${c.TUKENDI} tükendi`);
    if (c.KRITIK) parts.push(`${c.KRITIK} kritik (stok tedarik süresinden önce bitiyor ya da ${MIN_STOK} adetin altında)`);
    sub = parts.join(" · ") + ". Liste en acil olandan başlıyor.";
  }

  const counters = STATUS_LIST.map(s =>
    `<div class="counter ${s.key}"><span class="n">${c[s.key]}</span><span class="l">${s.icon} ${s.label}</span></div>`
  ).join("");

  box.innerHTML = `
    <div class="summary-main">
      <div class="summary-headline">${headline}</div>
      <div class="summary-sub">${sub}</div>
    </div>
    <div class="counters">${counters}</div>`;
}

/* ---------- IK-12: ürün görseli ---------- */
const CATEGORY_ICONS = { ayakkabi: "👟", tisort: "👕", canta: "🎒", corap: "🧦" };
const DEFAULT_ICON = "📦";

function categoryIcon(kategori) {
  const k = String(kategori || "").toLocaleLowerCase("tr").trim()
    .replace(/ı/g, "i").replace(/ş/g, "s").replace(/ç/g, "c").replace(/ğ/g, "g").replace(/ö/g, "o").replace(/ü/g, "u");
  return CATEGORY_ICONS[k] || DEFAULT_ICON;
}

function iconHtml(icon) {
  return `<span class="thumb icon" aria-hidden="true">${icon}</span>`;
}

/** gorsel_url geçerliyse görsel, değilse kategori ikonu; görsel yüklenemezse (onerror) ikona döner */
function thumbHtml(r) {
  const icon = categoryIcon(r.kategori);
  const url = String(r.gorsel_url || "").trim();
  if (!/^https?:\/\/\S+$/i.test(url)) return iconHtml(icon);
  return `<img class="thumb" src="${esc(url)}" alt="" loading="lazy" data-icon="${icon}" onerror="thumbFailed(this)">`;
}

function thumbFailed(img) {
  img.outerHTML = iconHtml(img.dataset.icon || DEFAULT_ICON);
}

function visibleRows() {
  const q = state.search.trim().toLocaleLowerCase("tr");
  return state.rows.filter(r => {
    if (r.status === STATUS.HAREKETSIZ) { if (!state.showInactive) return false; }
    else if (!state.statusOn.has(r.status.key)) return false;
    if (state.category && r.kategori !== state.category) return false;
    if (q && !r.SKU.toLocaleLowerCase("tr").includes(q) && !r.ad.toLocaleLowerCase("tr").includes(q)) return false;
    return true;
  });
}

/** IK-10: durum çipleri + kategori listesi */
function renderFilters() {
  const c = countByStatus(state.rows);
  document.getElementById("statusChips").innerHTML = STATUS_LIST.map(s => {
    const on = s === STATUS.HAREKETSIZ ? state.showInactive : state.statusOn.has(s.key);
    return `<button type="button" class="chip ${on ? "on" : ""}" data-key="${s.key}">${s.icon} ${s.label} (${c[s.key]})</button>`;
  }).join("");
  document.querySelectorAll("#statusChips .chip").forEach(btn => btn.onclick = () => {
    const k = btn.dataset.key;
    if (k === "HAREKETSIZ") state.showInactive = !state.showInactive;   // IK-7 anahtarıyla aynı durum
    else if (state.statusOn.has(k)) state.statusOn.delete(k);
    else state.statusOn.add(k);
    renderFilters();
    renderTable();
  });
}

function renderCategoryOptions() {
  const cats = [...new Set(state.rows.map(r => r.kategori))].sort((a, b) => a.localeCompare(b, "tr"));
  if (!cats.includes(state.category)) state.category = "";
  const sel = document.getElementById("categorySelect");
  sel.innerHTML = `<option value="">Tüm kategoriler</option>` +
    cats.map(k => `<option value="${esc(k)}" ${k === state.category ? "selected" : ""}>${esc(k)}</option>`).join("");
}

function renderTable() {
  const rows = visibleRows();
  const tbody = document.getElementById("tbody");
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty">${state.rows.length ? "Seçili filtrelere uyan ürün yok." : "Bu görünümde ürün yok."}</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => `
      <tr class="row-${r.status.key}">
        <td><span class="badge ${r.status.key}">${r.status.icon} ${r.status.label}</span></td>
        <td class="action ${r.action.cls}">${r.action.main}${r.action.sub ? `<span class="action-sub">${r.action.sub}</span>` : ""}</td>
        <td class="sku">${esc(r.SKU)}</td>
        <td class="name"><div class="prod">${thumbHtml(r)}<span>${esc(r.ad)}</span></div></td>
        <td>${esc(r.kategori)}</td>
        <td class="num">${fmtNum(r.mevcut_stok)}</td>
        <td class="num">${fmtNum(r.gunluk_satis_ortalamasi)}</td>
        <td class="num">${fmtNum(r.tedarik_suresi_gun)}</td>
        <td class="num strong">${fmtKalanGun(r)}</td>
        <td>${fmtBitis(r)}</td>
      </tr>`).join("");
  }

  // IK-7: hareketsiz anahtarı
  const nInactive = state.rows.filter(r => r.status === STATUS.HAREKETSIZ).length;
  const bar = document.getElementById("inactiveBar");
  if (nInactive === 0) {
    bar.innerHTML = "";
  } else {
    bar.innerHTML = `<span>⚪ ${nInactive} hareketsiz ürün (reyonda stok var, satış 0)</span>
      <button class="link" id="toggleInactive">${state.showInactive ? "Gizle" : "Göster"}</button>`;
    document.getElementById("toggleInactive").onclick = () => {
      state.showInactive = !state.showInactive;
      renderFilters();
      renderTable();
    };
  }
  document.getElementById("rowCount").textContent = `${rows.length} / ${state.rows.length} ürün gösteriliyor`;
}

function render() {
  renderSummary();
  renderCategoryOptions();
  renderFilters();
  renderTable();
}

function initFilters() {
  document.getElementById("categorySelect").addEventListener("change", e => { state.category = e.target.value; renderTable(); });
  document.getElementById("searchInput").addEventListener("input", e => { state.search = e.target.value; renderTable(); });
}

function loadData(items) {
  state.rows = computeAll(items);
  // Yeni veri gelince filtreler varsayılana döner (eski arama yeni dosyadaki ürünleri gizlemesin)
  state.statusOn = new Set(DEFAULT_STATUS_ON);
  state.showInactive = false;
  state.category = "";
  state.search = "";
  document.getElementById("searchInput").value = "";
  render();
}

/* ============================================================
   DOSYA YÜKLEME + DOĞRULAMA (IK-8, IK-9, IK-11)
   ============================================================ */
const REQUIRED_COLUMNS = ["SKU", "ad", "kategori", "mevcut_stok", "gunluk_satis_ortalamasi", "tedarik_suresi_gun"];
const TEXT_COLUMNS = ["SKU", "ad", "kategori"];
const NUMBER_COLUMNS = ["mevcut_stok", "gunluk_satis_ortalamasi", "tedarik_suresi_gun"];
const OPTIONAL_COLUMNS = ["gorsel_url"];   // IK-12: yoksa dosya yine kabul edilir

/** Kolon adı normalize: büyük/küçük harf, baş/son boşluk, iç boşluk/tire → "_" toleranslı */
function normKey(s) {
  return String(s ?? "")
    .replace(/^﻿/, "")
    .replace(/[İIı]/g, "i")
    .toLowerCase()
    .trim()
    .replace(/[\s\-]+/g, "_");
}

function parseNumber(v) {
  if (typeof v === "number") return Number.isFinite(v) ? { ok: true, value: v } : { ok: false, reason: "sayısal değil" };
  const s = String(v ?? "").trim();
  if (s === "") return { ok: false, reason: "boş" };
  if (!/^-?\d+(\.\d+)?$/.test(s)) {
    return { ok: false, reason: /^-?\d+,\d+$/.test(s) ? `"${s}" sayısal değil (ondalık ayırıcı nokta olmalı)` : `"${s}" sayısal değil` };
  }
  return { ok: true, value: Number(s) };
}

/**
 * aoa: satır dizisi (ilk satır başlık). Dönüş:
 *  { missing: [eksik kolonlar] }  → yükleme reddedilir
 *  { items: [...], skipped: [{ row, sku, reason }] }
 */
function parseRows(aoa) {
  if (!aoa || aoa.length === 0) return { missing: REQUIRED_COLUMNS.slice(), empty: true };
  const header = aoa[0].map(normKey);
  const colIndex = {};
  const missing = [];
  for (const col of REQUIRED_COLUMNS) {
    const idx = header.indexOf(normKey(col));
    if (idx === -1) missing.push(col); else colIndex[col] = idx;
  }
  if (missing.length) return { missing };
  const gorselIdx = header.indexOf(normKey("gorsel_url"));   // -1 → kolon yok

  const items = [];
  const skipped = [];
  const seen = new Map(); // SKU → ilk görüldüğü satır no

  for (let i = 1; i < aoa.length; i++) {
    const raw = aoa[i] || [];
    const rowNo = i + 1; // Excel'deki satır numarası (1. satır başlık)
    if (raw.every(v => String(v ?? "").trim() === "")) continue; // tamamen boş satır: sessizce geç

    const reasons = [];
    const item = {};
    for (const col of TEXT_COLUMNS) {
      const v = String(raw[colIndex[col]] ?? "").trim();
      if (v === "") reasons.push(`${col} boş`);
      item[col] = v;
    }
    for (const col of NUMBER_COLUMNS) {
      const p = parseNumber(raw[colIndex[col]]);
      if (!p.ok) { reasons.push(`${col} ${p.reason}`); continue; }
      if (p.value < 0) { reasons.push(`${col} negatif (${p.value})`); continue; }
      item[col] = p.value;
    }
    if (item.tedarik_suresi_gun === 0) reasons.push("tedarik_suresi_gun 0 olamaz");
    // IK-12: geçersiz/boş görsel linki satırı atlatmaz, ekranda kategori ikonu gösterilir
    item.gorsel_url = gorselIdx === -1 ? "" : String(raw[gorselIdx] ?? "").trim();

    if (!reasons.length && item.SKU) {
      const key = item.SKU.toLocaleUpperCase("tr");
      if (seen.has(key)) reasons.push(`tekrarlanan SKU (ilk kayıt ${seen.get(key)}. satırda, o tutuldu)`);
      else seen.set(key, rowNo);
    }

    if (reasons.length) skipped.push({ row: rowNo, sku: item.SKU || "", reason: reasons.join("; ") });
    else items.push(item);
  }
  return { items, skipped };
}

/** CSV'yi metin olarak çöz: önce UTF-8, olmazsa Türkçe Windows kodlaması (Excel'in "CSV" kaydı) */
function decodeText(buf) {
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch { return new TextDecoder("windows-1254").decode(buf); }
}

async function readFileToAoa(file) {
  if (typeof XLSX === "undefined") {
    throw new Error("Dosya okuma kütüphanesi (SheetJS) yüklenemedi. İnternet bağlantısını kontrol edip sayfayı yenileyin.");
  }
  const buf = await file.arrayBuffer();
  const isCsv = /\.csv$/i.test(file.name);
  const wb = isCsv
    ? XLSX.read(decodeText(buf), { type: "string", raw: true })
    : XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  if (!ws) return [];
  return XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", blankrows: true, raw: true });
}

function showMessages(html) {
  document.getElementById("messages").innerHTML = html;
  document.querySelectorAll("#messages .close").forEach(b => b.onclick = () => b.parentElement.remove());
}

function setSourceBadge(fileName) {
  const badge = document.getElementById("sourceBadge");
  if (!fileName) {
    badge.className = "source-badge sample";
    badge.textContent = "ÖRNEK VERİ";
    return;
  }
  const t = new Date().toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
  badge.className = "source-badge file";
  badge.textContent = `Yüklenen dosya: ${fileName} · ${t}`;
  badge.title = badge.textContent;
}

async function handleFile(file) {
  if (!file) return;
  if (!/\.(xlsx|xls|csv)$/i.test(file.name)) {
    showMessages(`<div class="msg error"><button class="close">×</button><b>Dosya yüklenmedi</b>
      "${esc(file.name)}" desteklenmeyen bir dosya türü. Lütfen .xlsx veya .csv dosyası seçin.</div>`);
    return;
  }
  let result;
  try {
    result = parseRows(await readFileToAoa(file));
  } catch (e) {
    showMessages(`<div class="msg error"><button class="close">×</button><b>Dosya okunamadı</b>${esc(e.message || e)}</div>`);
    return;
  }

  if (result.missing) {
    const msg = result.empty
      ? "Dosya boş görünüyor."
      : `Eksik kolon: <b style="display:inline">${result.missing.map(esc).join(", ")}</b>.`;
    showMessages(`<div class="msg error"><button class="close">×</button><b>"${esc(file.name)}" yüklenmedi</b>
      ${msg} İlk satırda şu kolonlar olmalı: <code>${REQUIRED_COLUMNS.join(", ")}</code>.
      Doğru başlıklar için <a href="#" id="tplLink">şablonu indirin</a>. Ekrandaki veri değiştirilmedi.</div>`);
    document.getElementById("tplLink").onclick = e => { e.preventDefault(); downloadTemplate(); };
    return;
  }

  if (result.items.length === 0) {
    showMessages(`<div class="msg error"><button class="close">×</button><b>"${esc(file.name)}" yüklenmedi</b>
      Dosyada geçerli ürün satırı yok.${result.skipped.length ? ` ${result.skipped.length} satır hatalı:` : ""}
      ${skippedList(result.skipped)} Ekrandaki veri değiştirilmedi.</div>`);
    return;
  }

  loadData(result.items);
  setSourceBadge(file.name);
  showMessages(result.skipped.length
    ? `<div class="msg warn"><button class="close">×</button><b>⚠ ${result.skipped.length} satır atlandı</b>
        ${result.items.length} ürün yüklendi. Aşağıdaki satırlar hatalı olduğu için hesaba katılmadı:
        ${skippedList(result.skipped)}</div>`
    : "");
}

function skippedList(skipped) {
  if (!skipped.length) return "";
  return "<ul>" + skipped.map(s =>
    `<li>Satır ${s.row}${s.sku ? ` (${esc(s.sku)})` : ""}: ${esc(s.reason)}</li>`).join("") + "</ul>";
}

/** IK-11: doğru kolon adlarıyla örnek CSV (PO'nun 3 satırı) + isteğe bağlı gorsel_url (boş) */
function downloadTemplate() {
  const cols = [...REQUIRED_COLUMNS, ...OPTIONAL_COLUMNS];
  const lines = [cols.join(",")];
  SAMPLE_DATA.slice(0, 3).forEach(r => lines.push(cols.map(c => {
    const v = String(r[c] ?? "");
    return /[",]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n") + "\r\n"], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stok_sablonu.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function initUpload() {
  const input = document.getElementById("fileInput");
  input.addEventListener("change", () => { handleFile(input.files[0]); input.value = ""; });
  document.getElementById("templateBtn").addEventListener("click", downloadTemplate);

  // Sürükle-bırak
  let depth = 0;
  window.addEventListener("dragenter", e => { e.preventDefault(); depth++; document.body.classList.add("dragging"); });
  window.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
  window.addEventListener("dragover", e => e.preventDefault());
  window.addEventListener("drop", e => {
    e.preventDefault();
    depth = 0;
    document.body.classList.remove("dragging");
    handleFile(e.dataTransfer.files[0]);
  });
}

/* ---------- Başlangıç ---------- */
initUpload();
initFilters();
document.getElementById("today").textContent =
  new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
loadData(SAMPLE_DATA);
</script>
